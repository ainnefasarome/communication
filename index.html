</div>
<div class="toast" id="toast" role="status"></div>
</div>
<script>
var NO="ainnefasarome",LINK="https://t.me/"+NO;
var QR=["111111100101101000010010101111111", "100000100000001010110000001000001", "101110101000101110110100101011101", "101110100010101010100111101011101", "101110100101010100101011101011101", "100000101110100110010110101000001", "111111101010101010101010101111111", "000000001001101000011010000000000", "011111101100011001110001110111110", "101011000011010010110101111101001", "111100100101010001010001101110111", "010011010110000010010101010101000", "001110100011001011111101111111001", "100000010001001101101101101111101", "100110101111100001001001011101001", "100011000011011110010010011111101", "001101110110100000111011001001110", "010000001010000110111101001100100", "010101100110011011101001011011111", "000101010110000010101001010001010", "100010111110000000111001111100001", "000101001100001010101100110101101", "111001101011110110010100111011001", "000110010110011111000011100111001", "110000100101111111110000111111000", "000000001000010110001001100011011", "111111101000110111001110101011001", "100000101011111100001011100011011", "101110100100010101100111111111000", "101110100010100101111111010110010", "101110101010011111101001100010111", "100000100011011001100100111000000", "111111100101101111011100100010101"];
var app=document.getElementById("app"),scr=document.getElementById("scr"),hero=document.getElementById("hero"),av=document.getElementById("av"),top_=document.getElementById("top"),blob=document.getElementById("blob");
var room=document.getElementById("room"),list=document.getElementById("list"),msg=document.getElementById("msg"),comp=document.getElementById("comp"),toast=document.getElementById("toast");
var vv=window.visualViewport,exp=false,tt;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function say(t){toast.textContent=t;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("on")},2000)}
function go(u){var w=null;try{w=window.open(u,"_blank")}catch(e){}if(!w){location.href=u}}
function zoomed(){return !!vv&&vv.scale>1.01}
function fit(){
if(zoomed())return;
var lw=document.documentElement.clientWidth,h=vv?vv.height:window.innerHeight,oy=(vv&&vv.offsetTop)?vv.offsetTop:0,H=h;
if(lw>600&&h>lw){
var s=lw/360;H=h/s;
app.style.width="360px";app.style.maxWidth="none";app.style.margin="0";app.style.right="auto";app.style.left="0";app.style.transformOrigin="0 0";
app.style.transform=(oy?"translateY("+oy+"px) ":"")+"scale("+s+")";
}else{
["width","maxWidth","margin","right","left","transformOrigin"].forEach(function(p){app.style[p]=""});
app.style.transform=oy?"translateY("+oy+"px)":"";
}
app.style.height=H+"px";
app.style.setProperty("--H",H+"px");
app.style.setProperty("--W",app.clientWidth+"px");
}
function setExp(v){
exp=v;hero.classList.toggle("exp",v);
av.style.transform="";av.style.opacity="";
}
function onScr(){
var st=scr.scrollTop;
if(exp){if(st>6)setExp(false);else return}
var p=clamp(st/110,0,1),m=clamp((st-85)/45,0,1);
av.style.transform="translateY("+(st*0.65)+"px) scale("+(1-0.8*p)+")";
av.style.opacity=1-clamp((p-0.55)/0.45,0,1);
hero.querySelector(".who").style.opacity=1-clamp((st-70)/50,0,1);
top_.style.setProperty("--bo",clamp((st-70)/50,0,1));
top_.style.setProperty("--mo",m);
top_.style.setProperty("--my",(8*(1-m))+"px");
blob.style.setProperty("--bk",clamp((p-0.5)/0.3,0,1)*(1-clamp((p-0.85)/0.15,0,1)));
}
scr.addEventListener("scroll",onScr,{passive:true});
var ty0=0,pull=0,drag=false,wacc=0;
scr.addEventListener("touchstart",function(e){ty0=e.touches[0].clientY;pull=0;drag=false},{passive:true});
scr.addEventListener("touchmove",function(e){
var dy=e.touches[0].clientY-ty0;
if(exp){if(dy<-24)setExp(false);return}
if(scr.scrollTop<=0&&dy>0){
drag=true;pull=Math.min(dy*0.55,140);
hero.style.transition="none";hero.style.height="calc(var(--sa) + "+(252+pull)+"px)";
av.style.transform="translateY("+(pull*0.5)+"px) scale("+(1+pull/300)+")";
if(e.cancelable)e.preventDefault();
}
},{passive:false});
function endDrag(){
if(!drag)return;
hero.style.transition="";hero.style.height="";av.style.transform="";
if(pull>56)setExp(true);
drag=false;pull=0;
}
scr.addEventListener("touchend",endDrag);
scr.addEventListener("touchcancel",endDrag);
scr.addEventListener("wheel",function(e){
if(exp){if(e.deltaY>0)setExp(false);return}
if(scr.scrollTop<=0&&e.deltaY<0){wacc+=-e.deltaY;if(wacc>120){setExp(true);wacc=0}}else{wacc=0}
},{passive:true});
av.addEventListener("click",function(){setExp(!exp)});
document.addEventListener("pointerdown",function(e){
var t=e.target.closest?e.target.closest(".rip"):null;if(!t)return;
var r=t.getBoundingClientRect(),k=t.offsetWidth?r.width/t.offsetWidth:1,d=Math.max(t.offsetWidth,t.offsetHeight)*1.3,s=document.createElement("span");
s.className="rp";s.style.cssText="width:"+d+"px;height:"+d+"px;left:"+((e.clientX-r.left)/k-d/2)+"px;top:"+((e.clientY-r.top)/k-d/2)+"px";
t.appendChild(s);setTimeout(function(){s.remove()},600);
});
var bio=document.getElementById("bio"),more=document.getElementById("more");
document.getElementById("bioRow").addEventListener("click",function(){var o=bio.classList.toggle("open");more.classList.toggle("h",o)});
document.getElementById("linkRow").addEventListener("click",function(e){if(e.target.closest("#qrOpen"))return;go(LINK)});
var chips=document.querySelectorAll(".chip");
function mark(){chips.forEach(function(b){b.classList.toggle("on",b.getAttribute("data-t")===msg.value)});comp.classList.toggle("has-t",msg.value.length>0)}
chips.forEach(function(b){b.addEventListener("click",function(){msg.value=b.getAttribute("data-t");mark();msg.classList.remove("sw");void msg.offsetWidth;msg.classList.add("sw")})});
msg.addEventListener("input",mark);
msg.addEventListener("focus",function(){setTimeout(function(){scr.scrollTo({top:scr.scrollHeight,behavior:"smooth"})},300)});
function jam(){var d=new Date();return ("0"+d.getHours()).slice(-2)+"."+("0"+d.getMinutes()).slice(-2)}
function kirim(){
var v=msg.value.trim();
if(!v){msg.focus();return}
var b=document.createElement("div");b.className="b";
var t=document.createElement("span");t.textContent=v;b.appendChild(t);
var i=document.createElement("i");i.innerHTML=jam()+' <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13l4 4L14 7M10 15l2 2L21 7"/></svg>';b.appendChild(i);
list.appendChild(b);room.classList.add("has");list.scrollTop=list.scrollHeight;
msg.value="";mark();
try{var cp=navigator.clipboard.writeText(v);if(cp&&cp.catch)cp.catch(function(){})}catch(e){}
say("Pesan disalin, membuka Telegram...");
setTimeout(function(){go(LINK+"?text="+encodeURIComponent(v))},600);
}
document.getElementById("mic").addEventListener("click",kirim);
msg.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();kirim()}});
var sk=document.querySelectorAll(".s"),si=0,stm;
function nextS(){sk[si].classList.remove("on");si=(si+1)%sk.length;sk[si].classList.add("on")}
function loopS(){clearInterval(stm);stm=setInterval(nextS,3400)}
document.getElementById("stk").addEventListener("click",function(){nextS();loopS()});
loopS();
/* ---- Halaman Kode QR ---- */
var TH=[{e:"",tc:"#1e90f0",a:"#2a8bf2",b:"#4eb0f5"},{e:"\uD83D\uDC25",tc:"#7cb342",a:"#2e7d32",b:"#6fae3e"},{e:"\u26C4",tc:"#3b9ae1",a:"#3b82f6",b:"#4aa8f0"},{e:"\uD83D\uDC8E",tc:"#b36ae2",a:"#3b8cf5",b:"#b05cf0"},{e:"\uD83C\uDFE0",tc:"#1e90f0",a:"#1f6fe0",b:"#3aa8f0"}];
var qr=document.getElementById("qr"),th=0,tiles=document.getElementById("tiles");
function buildQR(){
var N=QR.length,fx=[[0,0],[N-7,0],[0,N-7]],s="";
function inF(r,c){for(var k=0;k<3;k++){if(r>=fx[k][1]-1&&r<=fx[k][1]+7&&c>=fx[k][0]-1&&c<=fx[k][0]+7)return true}return false}
for(var r=0;r<N;r++)for(var c=0;c<N;c++){
if(QR[r].charAt(c)!=="1"||inF(r,c))continue;
if(Math.abs(r-(N-1)/2)<4&&Math.abs(c-(N-1)/2)<4)continue;
s+='<rect x="'+c+'" y="'+r+'" width="1" height="1" rx=".12"/>';
}
var f="";
for(var k=0;k<3;k++){var x=fx[k][0],y=fx[k][1];
f+='<rect x="'+x+'" y="'+y+'" width="7" height="7" rx="1.2"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" rx="0.8" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" rx=".5"/>';}
var m=(N-1)/2+.5;
var logo='<circle cx="'+m+'" cy="'+m+'" r="3.6" fill="#fff"/><path d="M'+(m-2)+' '+m+'L'+(m+2)+' '+(m-1.4)+'L'+(m+1)+' '+(m+1.8)+'L'+(m-.2)+' '+(m+.8)+'L'+(m-.8)+' '+(m+1.6)+'L'+(m-.9)+' '+(m+.6)+'Z"/>';
document.getElementById("qrBox").innerHTML='<svg class="qrs" viewBox="0 0 '+N+' '+N+'" aria-label="Kode QR t.me/ainnefasarome"><defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs><g fill="url(#qg)">'+s+f+logo+'</g></svg>';
}
function setTh(i){
th=i;var T=TH[i];
qr.style.setProperty("--tc",T.tc);qr.style.setProperty("--g1",T.a);qr.style.setProperty("--g2",T.b);
Array.prototype.forEach.call(tiles.children,function(el,k){el.classList.toggle("on",k===i)});
}
TH.forEach(function(T,i){
var b=document.createElement("button");b.type="button";b.className="tile";b.style.setProperty("--c1",T.a);b.style.setProperty("--c2",T.b);b.textContent=T.e;b.setAttribute("aria-label","Tema "+(i+1));
b.addEventListener("click",function(){setTh(i)});tiles.appendChild(b);
});
function openQR(){qr.classList.add("on");try{history.pushState({q:1},"")}catch(e){}}
function closeQR(){if(!qr.classList.contains("on"))return;qr.classList.remove("on");try{if(history.state&&history.state.q)history.back()}catch(e){}}
window.addEventListener("popstate",function(){qr.classList.remove("on")});
document.getElementById("qrOpen").addEventListener("click",function(e){e.stopPropagation();openQR()});
document.getElementById("qBack").addEventListener("click",closeQR);
document.getElementById("sun").addEventListener("click",function(){qr.classList.toggle("day")});
function shareQR(){
var T=TH[th],N=QR.length,z=16,q=2,W=(N+q*2)*z+80,Hh=W+90,cv=document.createElement("canvas");cv.width=W;cv.height=Hh;
var x=cv.getContext("2d");
x.fillStyle=qr.classList.contains("day")?"#e9eef4":"#0b141c";x.fillRect(0,0,W,Hh);
x.fillStyle="#fff";
var rr=function(a,b,c,d,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+c,b,a+c,b+d,r);x.arcTo(a+c,b+d,a,b+d,r);x.arcTo(a,b+d,a,b,r);x.arcTo(a,b,a+c,b,r);x.closePath()};
rr(20,20,W-40,Hh-40,36);x.fill();
var g=x.createLinearGradient(40,40,W-40,W-40);g.addColorStop(0,T.a);g.addColorStop(1,T.b);x.fillStyle=g;
var ox=40+q*z,oy=40+q*z;
for(var r=0;r<N;r++)for(var c=0;c<N;c++){
if(QR[r].charAt(c)!=="1")continue;
if(Math.abs(r-(N-1)/2)<4&&Math.abs(c-(N-1)/2)<4)continue;
x.fillRect(ox+c*z,oy+r*z,z-.5,z-.5);
}
x.font="800 34px Arial,sans-serif";x.textAlign="center";x.fillText("@AINNEFASAROME",W/2,Hh-50);
cv.toBlob(function(bl){
try{
var f=new File([bl],"kode-qr-ainnefasarome.png",{type:"image/png"});
if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Kode QR Telegram"}).catch(function(){});return}
}catch(e){}
if(navigator.share){navigator.share({title:"Telegram Banghans",url:LINK}).catch(function(){})}
else{try{var c2=navigator.clipboard.writeText(LINK);if(c2&&c2.catch)c2.catch(function(){});say("Link disalin")}catch(e){say(LINK)}}
});
}
document.getElementById("qShare").addEventListener("click",shareQR);
buildQR();setTh(0);
if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",function(){setTimeout(fit,300)});
fit();onScr();
</script>
</body>
</html>
